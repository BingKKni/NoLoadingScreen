# Tags publish the same complete target matrix checked on pushes and pull requests.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  builds:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      mod_version: ${{ needs.version.outputs.value }}

  release:
    needs: [version, builds]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: collect verified target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: noloadingscreen-*-dev-build
          path: release-artifacts
          merge-multiple: true

      - name: check complete release set
        env:
          MOD_VERSION: ${{ needs.version.outputs.value }}
        run: |
          targets=(Fabric-26.1.x NeoForge-26.1.x Forge-26.1.x
                   Fabric-26.2 NeoForge-26.2 Forge-26.2 Fabric-26.3
                   NeoForge-1.21.10 NeoForge-1.21.11)
          for target in "${targets[@]}"; do
            test -f "release-artifacts/NoLoadingScreen-${MOD_VERSION}-${target}.jar"
            test -f "release-artifacts/NoLoadingScreen-${MOD_VERSION}-${target}-sources.jar"
          done
          count=$(find release-artifacts -maxdepth 1 -name '*.jar' | wc -l)
          test "$count" -eq 18

      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          name: NoLoadingScreen ${{ needs.version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/NoLoadingScreen-${{ needs.version.outputs.value }}-*.jar
