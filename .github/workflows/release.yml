# Pushing a tag like v1.0.1 builds that version and publishes it as a GitHub
# Release with the jars attached.
#
#   git tag v1.0.1
#   git push origin v1.0.1
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      # The tag is the single source of truth for the version, so the jar name can
      # never drift from the release it is attached to.
      - name: resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: build
        run: ./gradlew build --stacktrace -Pversion=${{ steps.version.outputs.value }}

      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          name: NoLoadingScreen ${{ steps.version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/libs/noloadingscreen-${{ steps.version.outputs.value }}.jar
            build/libs/noloadingscreen-${{ steps.version.outputs.value }}-sources.jar
