# Builds every push and pull request, so a broken commit is caught before anyone
# downloads a jar from it.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-26.2
            java: '25'
            project: '.'
            artifacts: 'build/libs/'
          - target: neoforge-1.21.10
            java: '21'
            project: 'platforms/neoforge-1.21.10'
            artifacts: 'platforms/neoforge-1.21.10/build/libs/'
          - target: neoforge-1.21.11
            java: '21'
            project: 'platforms/neoforge-1.21.11'
            artifacts: 'platforms/neoforge-1.21.11/build/libs/'
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'

      # Caches the Gradle dependency cache, which matters here because Loom pulls
      # down the ~39 MB Minecraft client jar plus its libraries on a cold run.
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew -p ${{ matrix.project }} build check --stacktrace

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: noloadingscreen-${{ matrix.target }}-dev-build
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
